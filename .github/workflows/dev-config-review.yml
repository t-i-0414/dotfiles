name: dev-config review

on:
  schedule:
    # 毎週月曜 9:30（日本時間）
    - cron: '30 0 * * 1'
  workflow_dispatch:

jobs:
  review:
    uses: takudev-works/dev-config/.github/workflows/reusable-dev-config-review.yml@f8a6bfecde6062f6ac6ef68df3b2e9b10a0c6976 # v5.0.0
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      id-token: write
