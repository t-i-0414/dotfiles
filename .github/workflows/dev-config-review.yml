name: dev-config review

on:
  schedule:
    # 毎週月曜 9:30（日本時間）
    - cron: '30 0 * * 1'
  workflow_dispatch:

jobs:
  review:
    uses: takudev-works/dev-config/.github/workflows/reusable-dev-config-review.yml@3576945a828a6a2135d14304696b8a0269337de7 # v5.1.0
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      id-token: write
