name: dev-config review

on:
  schedule:
    # 毎週月曜 9:30（日本時間）
    - cron: '30 0 * * 1'
  workflow_dispatch:

jobs:
  review:
    uses: takudev-works/dev-config/.github/workflows/reusable-dev-config-review.yml@0193ba893fb40a7bdc960a9a6e0b15eb9d923c2c # v4.0.0
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      id-token: write
